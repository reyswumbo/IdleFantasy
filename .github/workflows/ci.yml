name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Unit tests, lint, debug & release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Generate signing keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/defide-release.jks \
            -storepass "$DEFIDE_STORE_PASSWORD" \
            -alias defide \
            -keypass "$DEFIDE_KEY_PASSWORD" \
            -dname "CN=Idle Fantasy CI, OU=Build, O=Idle Fantasy, L=Jakarta, C=ID" \
            -keyalg RSA -keysize 2048 -validity 3650
        env:
          DEFIDE_STORE_PASSWORD: idler-ci-build
          DEFIDE_KEY_PASSWORD: idler-ci-build

      - name: Assemble release APK (minified)
        run: ./gradlew assembleRelease --stacktrace
        env:
          DEFIDE_STORE_PASSWORD: idler-ci-build
          DEFIDE_KEY_PASSWORD: idler-ci-build

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: IdleFantasy-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7
